#cloud-config
debug: True

write_files:
  - path: /etc/sysctl.d/99-disable-ipv6.conf
    content: |
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 1

  - path: /etc/sysctl.d/98-inotify.conf
    content: |
      fs.inotify.max_user_instances=1024

  - path: /etc/bash.bashrc.local
    permissions: '0644'
    content: |
      alias ll='ls -la'
      alias la='ls -A'
      alias l='ls -CF'
      alias k='kubectl'
      if [[ $- == *i* ]]; then
        if command -v fastfetch &> /dev/null; then
          clear
          fastfetch
        fi
      fi

  - path: /etc/modules-load.d/iscsi.conf
    content: |
      iscsi_tcp

  - path: /etc/ssh/sshd_config.d/99-disable-motd.conf
    permissions: '0644'
    content: |
      PrintMotd no

users:
  - default
  - name: sles
    groups: users
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa  erquill@Erins-MacBook-Pro-2.local
  - name: erin
    groups: users
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa  erquill@Erins-MacBook-Pro-2.local

chpasswd:
  list: |
    root:$6$SalTsaLt$qzEfb8Z5QsG6iOUHXuUEdS5/0T5uej5nYNcYZQQf99dCdB7l8zVBYGBjw3D9TqnSR4NDNIWxEckOEtmIAUc6n.
    sles:$6$SalTsaLt$qzEfb8Z5QsG6iOUHXuUEdS5/0T5uej5nYNcYZQQf99dCdB7l8zVBYGBjw3D9TqnSR4NDNIWxEckOEtmIAUc6n.
    erin:$6$SalTsaLt$qzEfb8Z5QsG6iOUHXuUEdS5/0T5uej5nYNcYZQQf99dCdB7l8zVBYGBjw3D9TqnSR4NDNIWxEckOEtmIAUc6n.
  expire: False

runcmd:
  # 1. System Updates
  - zypper --non-interactive update
  - zypper --non-interactive in -t pattern yast2_basis
  - zypper --non-interactive in qemu-guest-agent git-core bash-completion vim nano nfs-client xclip iputils wget mc fastfetch tree btop open-iscsi cryptsetup kubernetes1.32-client curl

  # 2. Helm & k9s
  - |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    K9S_URL=$(curl -s https://api.github.com/repos/derailed/k9s/releases/latest | grep -Po '"browser_download_url": "\K.*_Linux_amd64\.tar\.gz' | head -n 1)
    wget "$K9S_URL" -O k9s.tar.gz && tar -xzf k9s.tar.gz -C /usr/local/bin/ k9s && rm k9s.tar.gz

  # 3. Infrastructure Config
  - sysctl --system
  - systemctl enable --now qemu-guest-agent iscsid
  - modprobe iscsi_tcp
  - [ sh, -c, "grep -q 'Include /etc/ssh/sshd_config.d/*.conf' /etc/ssh/sshd_config || echo 'Include /etc/ssh/sshd_config.d/*.conf' >> /etc/ssh/sshd_config" ]
  - systemctl restart sshd
  - if systemctl is-active --quiet firewalld.service; then systemctl disable --now firewalld.service; fi
