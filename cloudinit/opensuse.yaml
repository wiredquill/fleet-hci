#cloud-config
package_update: true
package_upgrade: true

write_files:
  - path: /etc/bash.bashrc.local
    permissions: "0644"
    content: |-
      alias ll='ls -la'
      alias k='kubectl'
      if [[ $- == *i* ]]; then
          command -v fastfetch >/dev/null 2>&1 && fastfetch
      fi
      export KUBECONFIG=/etc/rancher/rke2/rke2.yaml:/etc/rancher/k3s/k3s.yaml

  - path: /etc/sysctl.d/90-k8s-tuning.conf
    permissions: "0644"
    content: |-
      fs.inotify.max_user_instances = 1024
      fs.inotify.max_user_watches = 524288
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1

users:
  - default
  - name: erin
    passwd: "$2y$10$M8ZamcBlJG4xMooQSI7M2eAy2vrDrFx4WOG79SrPKjZUU/kDpsRE6"
    lock_passwd: false 
    groups: [sudo, wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  erquill@Erins-MacBook-Pro-2.local

packages:
  - fastfetch
  - curl
  - git
  - bash-completion
  - vim
  - nano
  - iputils
  - wget
  - mc
  - tree
  - bat
  - btop
  - open-iscsi
  - cryptsetup
  - qemu-guest-agent

runcmd:
  # 1. Install Latest Tools via Curl (Bypassing Zypper for newer versions)
  # Install kubectl (Stable)
  - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
  - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
  
  # Install Helm (Latest)
  - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  
  # Install K9s (Latest via GitHub)
  - export K9S_VERSION=$(curl -s https://api.github.com/repositories/173371755/releases/latest | grep tag_name | cut -d '"' -f 4)
  - curl -L -o k9s.tar.gz https://github.com/derailed/k9s/releases/download/${K9S_VERSION}/k9s_Linux_amd64.tar.gz
  - tar -xzf k9s.tar.gz && install -m 0755 k9s /usr/local/bin/k9s && rm k9s.tar.gz
  
  # 2. System Configuration
  - sysctl --system
  - firewall-cmd --permanent --add-port=6443/tcp
  - firewall-cmd --permanent --zone=trusted --add-source=10.42.0.0/16
  - firewall-cmd --permanent --zone=trusted --add-source=10.43.0.0/16
  - firewall-cmd --reload
  
  # 3. Enable Services
  - modprobe iscsi_tcp
  - systemctl enable --now iscsid
  - systemctl enable --now qemu-guest-agent
